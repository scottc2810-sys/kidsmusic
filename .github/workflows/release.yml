# Builds the one-click installers for Windows, macOS and Linux and attaches them to a release.
# Runs when a version tag (v1.2.0) is pushed, or by hand from the Actions tab.
name: Release installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r backend/requirements-dev.txt -c backend/requirements.lock
      - run: cd backend && python -m pytest -q
      - run: cd frontend && npm ci --no-audit --no-fund && npx tsc -b && npx vitest run

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # Code signing turns itself on when the secrets exist (see docs/SIGNING.md); without them the builds stay unsigned.
      WIN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && 'true' || 'false' }}
      MAC_SIGN: ${{ secrets.MACOS_CERT_P12 != '' && 'true' || 'false' }}
      MELO_PUBLISHER: ${{ vars.MELO_PUBLISHER || 'Melo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Voices (native speakers + neural voices for every word)
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # The voice pack is made on a machine that downloaded / recorded them (python packaging/voices.py pack)
          # and attached to the "voices" release. Without it the installers still work, with fewer bundled voices.
          if gh release download voices -R "${{ github.repository }}" -p melo-voices.zip -D build; then
            python packaging/voices.py fetch build/melo-voices.zip
            echo "MELO_SMOKE_VOICES=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No voice pack found on the 'voices' release: building without bundled recordings"
            echo "MELO_SMOKE_VOICES=0" >> "$GITHUB_ENV"
          fi
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./packaging/windows/build.ps1
      - name: Sign Melo.exe (Microsoft Azure Artifact Signing)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\Melo
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Rebuild the installer around the signed Melo.exe
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Melo -DestinationPath dist\Melo-windows.zip -Force
          ./packaging/windows/build.ps1 -InstallerOnly
      - name: Sign Melo-Setup.exe
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("dist\Melo\Melo.exe") + (Get-ChildItem dist\Melo-Setup-*.exe).FullName) {
            $s = Get-AuthenticodeSignature $f
            "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne "Valid") { exit 1 }
          }
      - name: Apple signing certificate (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Apple notarization key (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        env: { KEY_P8: "${{ secrets.APPLE_NOTARY_KEY_P8 }}" }
        run: |
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/notary.p8"
          {
            echo "MELO_CODESIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}"
            echo "MELO_NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8"
            echo "MELO_NOTARY_KEY_ID=${{ secrets.APPLE_NOTARY_KEY_ID }}"
            echo "MELO_NOTARY_ISSUER=${{ secrets.APPLE_NOTARY_ISSUER }}"
          } >> "$GITHUB_ENV"
      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y python3-tk libfuse2; fi
          chmod +x packaging/build.sh && ./packaging/build.sh
      - name: Smoke test the built app (starts it and checks every feature end to end)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) python packaging/smoke_test.py dist/Melo/Melo.exe ;;
            macOS)   python packaging/smoke_test.py dist/Melo.app/Contents/MacOS/Melo ;;
            *)       python packaging/smoke_test.py dist/Melo/Melo ;;
          esac
      - name: Install the package and test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Melo-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "melo-installed"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"" -Wait
          python packaging/smoke_test.py "$dir\Melo.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install the package and test the installed app (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              hdiutil attach dist/Melo-*.dmg -mountpoint /Volumes/Melo -nobrowse
              mkdir -p "$HOME/Applications" && cp -R /Volumes/Melo/Melo.app "$HOME/Applications/"  # what "drag Melo to Applications" does
              hdiutil detach /Volumes/Melo
              python packaging/smoke_test.py "$HOME/Applications/Melo.app/Contents/MacOS/Melo" ;;
            *)
              mkdir -p "$RUNNER_TEMP/unpack" && tar -C "$RUNNER_TEMP/unpack" -xzf dist/Melo-linux.tar.gz
              "$RUNNER_TEMP/unpack/Melo/install.sh" < /dev/null
              python packaging/smoke_test.py "$HOME/.local/share/melo-app/Melo"
              if ls dist/Melo-*.AppImage >/dev/null 2>&1; then chmod +x dist/Melo-*.AppImage && python packaging/smoke_test.py dist/Melo-*.AppImage; fi ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: melo-${{ runner.os }}
          path: |
            dist/Melo-Setup-*.exe
            dist/Melo-windows.zip
            dist/Melo-*.dmg
            dist/Melo-*.AppImage
            dist/Melo-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
